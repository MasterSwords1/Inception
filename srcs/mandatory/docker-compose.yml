name: inception

networks:
  my_net:
    driver: bridge

volumes:
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb_data

  wp-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wp_data

services:
  mariadb:
    build: ./mariadb
    container_name: mariadb
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: on-failure
    env_file:
      - ./.env
    environment:
      - WP_ADMIN=${WP_ADMIN}
      - WP_USER=${WP_USER}
    networks:
      - my_net
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build:
      context: ./wordpress
      args:
        - WORDPRESS_USER=wordpress_user
    container_name: wordpress
    restart: on-failure
    volumes:
      - wp-files:/var/www/wordpress
    env_file:
      - ./.env
    environment:
      - WP_ADMIN=${WP_ADMIN}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - my_net
    healthcheck:
      test: ["CMD-SHELL", "cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build: ./nginx
    container_name: nginx
    restart: on-failure
    ports:
      - 443:443
    volumes:
      - wp-files:/var/www/wordpress
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - my_net

