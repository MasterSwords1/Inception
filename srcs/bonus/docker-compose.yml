name: inception_bonus

networks:
  my_net:
    driver: bridge

volumes:
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ariyad/data/mariadb_data

  wp-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ariyad/data/wp_data
  owncast-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ariyad/data/owncast_data

services:
  ftp-server:
    build:
      context: ./ftp-server
      args:
        - FTP_USER=${FTP_USER}
        - FTP_USER_PASS=${FTP_USER_PASS}
    container_name: ftp_server
    depends_on:
      wordpress:
        condition: service_healthy
    restart: always
    volumes:
      - wp-files:/home/wp-filer
    networks:
      - my_net
    ports:
      - 2222:22

  owncast:
    build: ./owncast
    container_name: owncast
    restart: always
    ports:
      - 8000:8000
    volumes:
      - owncast-data:/owncast/data
  mariadb:
    build: ./mariadb
    container_name: mariadb
    restart: always
    volumes:
      - mariadb-data:/mariadb-data
    env_file:
      - ./.env
    environment:
      - WP_ADMIN=${WP_ADMIN}
      - WP_USER=${WP_USER}
    networks:
      - my_net
    healthcheck:
      start_period: 1m
      interval: 1m
      test:
        [
          "CMD-SHELL",
          '[ -d /mariadb-data ] && [ "$(ls -A /mariadb-data 2>/dev/null)" ]',
        ]

  wordpress:
    build:
      context: ./wordpress
      args:
        - WORDPRESS_USER=wordpress_user
    container_name: wordpress
    restart: always
    volumes:
      - wp-files:/var/www/wordpress
    env_file:
      - ./.env
    environment:
      - WP_ADMIN=${WP_ADMIN}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - my_net
    healthcheck:
      start_period: 1m
      interval: 1m
      test:
        [
          "CMD-SHELL",
          '[ -d /var/www/wordpress ] && [ "$(ls -A /var/www/wordpress 2>/dev/null)" ]',
        ]

  adminer:
    build:
      context: ./adminer
      args:
        - WORDPRESS_USER=wordpress_user
    container_name: adminer
    restart: always
    volumes:
      - wp-files:/var/www/wordpress
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - my_net

  nginx:
    build: ./nginx
    container_name: nginx
    restart: always
    ports:
      - 443:443
    volumes:
      - wp-files:/var/www/wordpress
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - my_net

  redis:
    build: ./redis
    container_name: redis
    restart: always
    networks:
      - my_net
